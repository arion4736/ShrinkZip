name: build-exe
on:
  workflow_dispatch:          # Actions tab -> build-exe -> "Run workflow"
  push:
    tags: ["v*"]              # git tag v2.1 && git push --tags  -> also publishes a Release
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install customtkinter pillow py7zr pyinstaller pytest
      - name: Run tests first (a failing test stops the build)
        run: python -m pytest -q
      - name: Bundle the native 7-Zip engine
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" .
          Copy-Item "C:\Program Files\7-Zip\7z.dll" .
      - run: pyinstaller shrink_unzip_gui.spec
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart("v") } else { "dev" }
          $env:APP_VERSION = $v
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ShrinkZIP.iss
      - name: Check the exe exists
        shell: pwsh
        run: |
          $f = Get-Item dist\ShrinkUnzip.exe
          "{0} MB" -f [math]::Round($f.Length/1MB,1)
      - uses: actions/upload-artifact@v4
        with:
          name: ShrinkZIP-windows
          path: |
            dist/ShrinkUnzip.exe
            dist/ShrinkZIP-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ShrinkUnzip.exe
            dist/ShrinkZIP-Setup.exe
