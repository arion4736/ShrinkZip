name: Build Windows EXE

# Normal pushes / PRs / manual runs  -> build + test + upload as a workflow ARTIFACT
# Pushing a version tag (v1.0.0, ...) -> the same, and also publish a GitHub RELEASE
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write        # only used to create the Release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag format (releases only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-].+)?$') {
            throw "Tag '$tag' is not a version tag. Use something like v1.0.0"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Detect project (language, framework, dependencies)
        shell: python
        run: |
          import os, re, sys
          print("Python:", sys.version.split()[0])
          assert sys.version_info >= (3, 10), "Python 3.10+ is required"
          entry = "shrink_unzip_gui.py"
          for f in (entry, "shrinkzip_engine.py", "shrink_unzip_gui.spec", "requirements.txt"):
              assert os.path.exists(f), f"missing required file: {f}"
          reqs = [re.split(r"[<>=\s#]", l.strip())[0].lower()
                  for l in open("requirements.txt") if l.strip() and not l.startswith("#")]
          print("Language : Python")
          print("Framework: customtkinter (Tk)" if "customtkinter" in reqs else "Framework: unknown")
          print("Entry    :", entry)
          print("Packages :", ", ".join(reqs))
          print("Optional : app_icon.ico =", os.path.exists("app_icon.ico"))
          assert "customtkinter" in reqs and "py7zr" in reqs, "expected dependencies not found"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"
          pip list

      - name: Unit tests (blocking on release tags, informational otherwise)
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python -m pytest -q -m "not slow" -p no:cacheprovider

      - name: Bundle the native 7-Zip engine
        shell: pwsh
        run: |
          $dir = "C:\Program Files\7-Zip"
          if (-not (Test-Path "$dir\7z.exe")) { choco install 7zip -y --no-progress }
          if (-not (Test-Path "$dir\7z.exe")) { throw "7-Zip is not installed on this runner" }
          Copy-Item "$dir\7z.exe", "$dir\7z.dll" -Destination .
          Copy-Item "$dir\License.txt" -Destination "7-Zip-License.txt"
          Get-Item 7z.exe, 7z.dll | Format-Table Name, Length

      - name: Build ShrinkZip.exe
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm shrink_unzip_gui.spec
          if (-not (Test-Path dist\ShrinkZip.exe)) { throw "dist\ShrinkZip.exe was not produced" }
          Get-Item dist\ShrinkZip.exe | Format-Table Name, Length

      - name: Build the self-test executable (same spec, same dependencies)
        shell: pwsh
        run: |
          $env:SHRINKZIP_ENTRY = ".github/ci/selftest.py"
          $env:SHRINKZIP_NAME = "ShrinkZip-selftest"
          $env:SHRINKZIP_CONSOLE = "1"
          pyinstaller --clean --noconfirm --distpath dist-test --workpath build-test shrink_unzip_gui.spec
          if (-not (Test-Path dist-test\ShrinkZip-selftest.exe)) { throw "self-test exe was not produced" }

      - name: Test - run the frozen self-test (extracts real archives)
        shell: pwsh
        run: |
          $output = & .\dist-test\ShrinkZip-selftest.exe 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed (exit code $LASTEXITCODE)" }

      - name: Test - the real ShrinkZip.exe is a valid program and starts
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\ShrinkZip.exe).Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "ShrinkZip.exe is not a Windows executable" }
          if ($bytes.Length -lt 5MB) { throw "ShrinkZip.exe is suspiciously small ($($bytes.Length) bytes)" }

          $p = Start-Process -FilePath $exe -PassThru
          $window = $null
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and -not $window) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "ShrinkZip.exe exited early with code $($p.ExitCode)" }
              # one-file exes run the app in a child process: look at the whole tree
              $ids = @($p.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object ProcessId)
              foreach ($id in $ids) {
                $proc = Get-Process -Id $id -ErrorAction SilentlyContinue
                if ($proc -and $proc.MainWindowHandle -ne 0) { $window = $proc; break }
              }
            }
            if ($window) { Write-Host "Window opened: '$($window.MainWindowTitle)'" }
            else {
              Start-Sleep -Seconds 5
              if ($p.HasExited) { throw "ShrinkZip.exe exited early with code $($p.ExitCode)" }
              Write-Warning "No window handle was visible to the runner, but the app is running and did not crash."
            }
          } finally {
            taskkill /PID $p.Id /T /F | Out-Null
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ShrinkZip.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ShrinkZip.exe" | Set-Content -Encoding ascii dist\ShrinkZip.exe.sha256
          Get-Content dist\ShrinkZip.exe.sha256

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShrinkZip-windows-x64
          path: |
            dist/ShrinkZip.exe
            dist/ShrinkZip.exe.sha256
            7-Zip-License.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShrinkZip.exe
            dist/ShrinkZip.exe.sha256
            7-Zip-License.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
